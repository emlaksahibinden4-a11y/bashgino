<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>باشگینو — سامانه مربیگری</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A8121E; --red-d:#8C0E18; --red-l:#FDECEE; --red-t:#C81E2B;
  --bg:#EFF0F2; --card:#fff; --line:#E4E5E9; --txt:#1B1B1F; --mut:#7A7A85;
  --gry:#F6F7F8; --gry-b:#E4E5E9; --gry-t:#5F606A;
  --yel:#FFFFFF; --yel-b:#E4E5E9; --yel-t:#C81E2B; --grn:#C81E2B; --grn-l:#FDECEE;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center}
.logo svg{width:22px;height:22px;stroke-width:2.2}
.ws{display:flex;align-items:center;gap:6px;background:#F3F3F5;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700}
.ws svg{width:16px;height:16px;color:var(--red)}
.ws .chev{color:var(--mut)}
.sp{flex:1}
.bell{position:relative;width:38px;height:38px;display:grid;place-items:center;color:#555}
.bell b{position:absolute;top:2px;right:4px;background:var(--red-t);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
.ava{width:36px;height:36px;border-radius:50%;background:var(--red-l);color:var(--red);display:grid;place-items:center;font-weight:800}

/* menu */
.menu{position:fixed;top:58px;left:12px;z-index:40;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.14);width:250px;padding:8px}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block}
.menu .who span{color:var(--mut);font-size:12px;direction:ltr;display:inline-block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;text-align:right}
.menu button:active{background:#F4F4F6}
.menu .out{color:var(--red-t)}
.scrim{position:fixed;inset:0;z-index:30}

/* layout */
main{padding:14px 14px calc(96px + var(--safe-b))}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:118px;margin:-14px -14px 10px;padding:16px 18px;overflow:hidden;background:linear-gradient(180deg,#fff,var(--bg))}
.hero h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px;z-index:1}
.hero h1 svg{color:var(--red);width:22px;height:22px}
.hero .art{position:absolute;left:0;top:0;height:100%;width:58%;opacity:.95}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;font-weight:700;padding:0 14px;white-space:nowrap}
.btn.p{background:var(--red);color:#fff}
.btn.p:active{background:var(--red-d)}
.btn.o{background:#fff;border:1.5px solid #DADADF}
.btn.ol{background:#fff;border:1.5px solid var(--red-t);color:var(--red-t)}
.btn.sm{height:38px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid #E0E0E4;background:#fff;font-size:13px;font-weight:600}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-size:16px;margin:0;display:flex;align-items:center;gap:6px}
.sec h2 svg{color:var(--red)}
.link{color:var(--red-t);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.link svg{width:14px;height:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mut{color:var(--mut)}
.sm{font-size:12px}

/* subscription card */
.sub{background:var(--yel);border:1px solid var(--yel-b)}
.sub .top{display:flex;gap:10px;align-items:center}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--red-l);border:0;color:var(--red)}
.ic svg{width:22px;height:22px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--gry-b);color:var(--gry-t)}
.tag.r{background:var(--red-l);color:var(--red-t)}
.tag.g{background:var(--red);color:#fff}
.cap{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-size:13px}
.bar{height:6px;border-radius:4px;background:var(--gry-b);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn);border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv{background:var(--gry);border:1px solid var(--gry-b);border-radius:12px;padding:10px 12px}
.kv span{display:flex;align-items:center;gap:5px;color:#66666F;font-size:12px}
.kv span svg{width:14px;height:14px}
.kv b{display:block;margin-top:6px;font-size:15px}
.warn{display:flex;gap:6px;align-items:center;color:var(--yel-t);font-size:12px;margin:12px 0}
.warn svg{width:15px;height:15px}
.acts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.acts .chip{flex:none;padding:0 11px;font-size:12px}
.notice{background:var(--gry);border:1px solid var(--gry-b);border-right:3px solid var(--red-t);color:var(--gry-t);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.9;margin-top:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat svg{color:var(--red);width:20px;height:20px}
.stat b{display:block;font-size:24px;margin:2px 0}
.stat span{font-size:12px;color:var(--mut)}
.range{font-size:12px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px;display:flex;align-items:center;gap:4px}
.range svg{width:13px;height:13px}

/* search + filters */
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;flex:1}
.search svg{color:var(--mut)}
.search input{border:0;outline:0;flex:1;background:none}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}

/* list items */
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:right}
.item .av{width:42px;height:42px;border-radius:12px;background:var(--red-l);color:var(--red);display:grid;place-items:center;font-weight:800;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12px;color:var(--mut)}
.item>svg{color:#B5B5BC}

/* empty */
.empty{text-align:center;padding:28px 16px}
.empty .ill{width:96px;height:96px;margin:0 auto 14px;border-radius:24px;background:var(--red-l);display:grid;place-items:center;color:var(--red);position:relative;transform:rotate(-4deg)}
.empty .ill svg{width:40px;height:40px}
.empty h3{margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;color:var(--mut);font-size:13px;line-height:1.9}
.empty .btn{display:inline-flex;min-width:180px}

/* skeleton */
.sk{height:72px;border-radius:14px;background:linear-gradient(90deg,#f0f0f2 25%,#f7f7f9 50%,#f0f0f2 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#6B6B75;padding:4px 0}
nav button i{width:40px;height:30px;border-radius:10px;display:grid;place-items:center}
nav button.on{color:var(--red-t);font-weight:700}
nav button.on i{background:var(--red-l)}
nav svg{width:21px;height:21px}

/* forms */
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid #DEDEE3;border-radius:12px;background:#fff;padding:12px;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--red-t);box-shadow:0 0 0 3px var(--red-l)}
.f textarea{min-height:80px;resize:vertical}
.ltr{direction:ltr;text-align:right}
.ex{display:grid;grid-template-columns:2fr 1fr 1fr 28px;gap:6px;margin-bottom:6px}
.ex input{padding:10px 8px;border:1px solid #DEDEE3;border-radius:10px;width:100%;min-width:0}
.x{color:#B5B5BC;display:grid;place-items:center}
.day{border:1px dashed #DADADF;border-radius:14px;padding:12px;margin-bottom:10px;background:#FCFCFD}
.day h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.check input{width:18px;height:18px;accent-color:var(--red)}
.pagehead{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.pagehead h1{font-size:18px;margin:0}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.back svg{transform:scaleX(-1)}

/* plans */
.dur{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;margin:12px 0}
.dur button{flex:1;height:42px;border-radius:10px;font-weight:700;font-size:13px;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}
.dur button.on{background:var(--red);color:#fff}
.dur em{position:absolute;top:-9px;right:6px;font-style:normal;font-size:10px;background:var(--red-t);color:#fff;border-radius:6px;padding:0 5px}
.plan{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;width:100%;text-align:right}
.plan.cur{border-color:var(--red-t)}
.plan .ic{border-color:var(--line);color:var(--red-t)}
.plan.cur .ic{background:var(--red);color:#fff}
.plan .tx{flex:1;min-width:0}
.plan .tx b{font-size:15px}
.plan .tx p{margin:4px 0 0;font-size:12px;color:var(--mut)}
.plan .pr{text-align:left;border-right:1px solid var(--line);padding-right:10px}
.plan .pr b{color:var(--red-t);display:block;font-size:14px;white-space:nowrap}
.plan .pr span{font-size:11px;color:var(--mut)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;text-align:center;margin-top:12px}
.feat i{width:40px;height:40px;border-radius:12px;background:var(--red-l);color:var(--red);display:grid;place-items:center;margin:0 auto 6px}
.feat span{font-size:12px}
ul.notes{margin:8px 0 0;padding:0 18px;color:#55555E;font-size:13px;line-height:2}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px}
.ob .brand{text-align:center;margin-bottom:22px}
.ob .brand .logo{margin:0 auto 8px;width:56px;height:56px;border-radius:16px}
.ob .brand .logo svg{width:30px;height:30px}
.ob h1{font-size:20px;text-align:center;margin:0 0 6px}
.role{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;width:100%;text-align:right}
.role.on{border-color:var(--red-t);background:#FFF8F8}
.role .ic{background:var(--red-l);border:0;color:var(--red)}
.role b{display:block;font-size:15px}
.role span{font-size:12px;color:var(--mut);line-height:1.8}

/* sheet / toast */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet .in{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:86vh;overflow:auto;padding:18px 16px calc(18px + var(--safe-b))}
.sheet h3{margin:0 0 12px}
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:13px;max-width:90%;text-align:center}
.soon{text-align:center;padding:90px 20px;color:var(--mut);font-size:16px}
.soon svg{width:46px;height:46px;color:#D5D5DA;margin-bottom:10px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:#F1F1F3;color:#55555E;margin-left:4px}
/* ===== تم «باشگاهی» — هدر تیره، فونت درشت، دکمه‌های گرد، منوی شناور ===== */
:root{ --ink:#111214; --ink-2:#1D1E22; --ink-3:#2A2B30; --r:20px }
body{background:var(--bg)}
.hdr{background:var(--ink);border-bottom:0;backdrop-filter:none;padding:12px 16px}
.ws{background:var(--ink-2);border-color:var(--ink-3);color:#fff}
.ws .chev{color:#9A9BA3}
.bell{color:#fff}
.ava{background:var(--red);color:#fff}
.hero{background:var(--ink);color:#fff;min-height:150px;margin:-14px -14px 16px;padding:18px 20px 30px;border-radius:0 0 30px 30px;align-items:flex-end}
.hero h1{font-size:25px;font-weight:800;line-height:1.5;letter-spacing:-.3px}
.hero h1 svg{color:#fff}
.hero .art{opacity:.9}
.hero .art rect[fill="#3A3A40"]{fill:#3B3C42}.hero .art rect[fill="#55555C"]{fill:#5A5B62}.hero .art rect[fill="#9A9AA2"]{fill:#8D8E96}
.hero .art ellipse[fill="#EDEDF0"]{fill:#2A2B30}.hero .art rect[fill="#fff"]{fill:#F4F4F6}
.btn{border-radius:999px;height:50px;font-weight:800}
.btn.sm{border-radius:999px}
.btn.o{background:#fff;border:1.5px solid #D9DADF}
.btn.p{box-shadow:0 8px 20px rgba(168,18,30,.28)}
.chip{border-radius:999px;border-color:#DCDDE2}
.card,.item,.stat,.plan,.search{border:0;box-shadow:0 2px 14px rgba(17,18,20,.06)}
.card{border-radius:var(--r)}
.item{border-radius:18px;padding:14px}
.item .av{border-radius:50%;background:var(--ink);color:#fff}
.sec h2{font-size:17px;font-weight:800}
.stats{gap:10px}
.stat{border-radius:20px;padding:16px 6px}
.stat b{font-size:30px;font-weight:800}
.stats .stat:first-child{background:var(--red);color:#fff}
.stats .stat:first-child svg,.stats .stat:first-child span{color:#fff}
.sub{border:0;box-shadow:0 2px 14px rgba(17,18,20,.06)}
.kv{border:0}
.search{border-radius:999px;height:50px}
.range{border:0;background:var(--gry-b)}
nav{left:12px;right:12px;bottom:calc(10px + var(--safe-b));border-radius:26px;background:var(--ink);border-top:0;padding:8px 6px;box-shadow:0 10px 30px rgba(17,18,20,.35)}
nav button{color:#8D8E96}
nav button i{width:44px;height:32px;border-radius:999px}
nav button.on{color:#fff}
nav button.on i{background:var(--red);color:#fff}
main{padding-bottom:calc(110px + var(--safe-b))}
.menu{border-radius:20px}
.f input,.f select,.f textarea{border-radius:14px;background:#fff}
.dur{border:0;border-radius:999px;box-shadow:0 2px 14px rgba(17,18,20,.06)}
.dur button{border-radius:999px}
.ob{background:var(--ink);color:#fff}
.ob .brand b{color:#fff}.ob .brand .mut{color:#9A9BA3}
.ob h1{color:inherit}
.ob>.mut{color:#9A9BA3!important}
.ob .card{color:var(--txt);border-radius:26px}
.ob .card h1{color:var(--txt)}
.role{border:0;background:var(--ink-2);color:#fff}
.role span{color:#9A9BA3}
.role.on{background:var(--ink-3);box-shadow:inset 0 0 0 2px var(--red-t)}
.ob>.f label{color:#fff}
.ob .link{color:#fff}
.ob>.btn.o{background:transparent;color:#fff;border-color:var(--ink-3)}
.toast{border-radius:999px;padding:12px 20px}
.ob .card .brand b{color:var(--txt)}.ob .card .brand .mut{color:var(--mut)}
.menu{top:68px}
.sheet .in{border-radius:28px 28px 0 0}

/* عکس‌ها و هوش مصنوعی */
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center left;z-index:0}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(17,18,20,.95) 30%,rgba(17,18,20,.35) 75%,rgba(17,18,20,.15))}
.hero h1{position:relative;z-index:1}
.ob.photo{background-size:cover;background-position:center}
.spin{width:42px;height:42px;margin:auto;border-radius:50%;border:4px solid var(--red-l);border-top-color:var(--red);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.ai{background:linear-gradient(135deg,#1D1E22,#3A1015);color:#fff;margin-bottom:12px}
.btn.ai svg{color:#FF6B76}
.aibox{background:var(--ink);color:#fff;border-radius:20px;padding:14px;margin-top:12px}
.aibox b{display:flex;align-items:center;gap:6px;margin-bottom:10px}.aibox b svg{color:#FF6B76}
.aibox .chip{background:var(--ink-2);border-color:var(--ink-3);color:#fff}
.aicard{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--ink);color:#fff;border-radius:20px;padding:14px;margin-bottom:6px}
.aicard>div{width:46px;height:46px;border-radius:14px;background:var(--red);display:grid;place-items:center;flex:none}
.aicard>span{flex:1}.aicard b{display:block}.aicard span span{font-size:12px;color:#B5B6BC}
.photo-pick{width:100%;min-height:160px;border:2px dashed #D3D4D9;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mut);margin-bottom:14px;overflow:hidden;background:var(--gry)}
.photo-pick svg{width:32px;height:32px}.photo-pick img{width:100%;max-height:340px;object-fit:contain}
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:70px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;line-height:1.9;white-space:pre-line;font-size:14px}
.msg.user{align-self:flex-start;background:var(--red);color:#fff;border-bottom-right-radius:6px}
.msg.assistant{align-self:flex-end;background:#fff;box-shadow:0 2px 14px rgba(17,18,20,.06);border-bottom-left-radius:6px}
.chatbar{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--safe-b));display:flex;gap:8px;z-index:19}
.chatbar input{flex:1;border:0;border-radius:999px;padding:0 18px;height:50px;box-shadow:0 4px 18px rgba(17,18,20,.12);outline:0;background:#fff}
.chatbar .btn{width:50px;padding:0}
.dots{letter-spacing:4px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.3}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ======================= تنظیمات — این بخش را تغییر بده ======================= */
const CONFIG = {
  appName: 'باشگینو',
  appTagline: 'سامانه مربیگری',
  // نام کاربری ربات بدون @ (اگر ربات آدرس را با ?bot= بفرستد خودکار پر می‌شود)
  botUsername: (window.__BG && __BG.bot) || 'YOUR_BOT_USERNAME',
  supportUsername: (window.__BG && __BG.support) || '',
  trialDays: 30,
  trialUsers: 3,
  paymentsEnabled: false,
  ai: !!(window.__BG && __BG.ai),
  images: (window.__BG && __BG.images) || {},

async function api(method, path, body){
  const r = await fetch('/api' + path, { method, headers: Object.assign({'Content-Type':'application/json'}, TOKEN ? {Authorization:'Bearer ' + TOKEN} : {}), body: body ? JSON.stringify(body) : undefined });
  let d = {}; try { d = await r.json(); } catch(e) {}
  if (r.status === 401 && TOKEN && !path.startsWith('/auth/')) { setToken(null); S = null; auth = {step:'phone'}; render(); }
  if (!r.ok) { const e = new Error(d.error || 'خطا در ارتباط با سرور'); e.status = r.status; e.data = d; throw e; }

}

function applyBoot(d){
  ME = d.user; ATH = d.athleteOf || [];
  if (ME.role === 'coach' || ME.role === 'gym') {
    const it = d.items || {};
    S = { role: ME.role, name: ME.name, phone: ME.phone, plan: d.plan, payments: [] };
    COLS.forEach(c => S[c] = it[c] || []);
    S.ws = (S.workspaces.find(w => w.id === lsGet('bg_ws')) || S.workspaces[0] || {}).id || null;
    synced = {}; COLS.forEach(c => { synced[c] = {}; S[c].forEach(o => synced[c][o.id] = JSON.stringify(o)); });
    S._meSig = S.name + '|' + S.role;
  } else {
    S = { role: ME.role || null, name: ME.name, phone: ME.phone, athlete: true };
  }
}

let _syncT = null, _syncing = false, _again = false;
function save(){ clearTimeout(_syncT); _syncT = setTimeout(sync, 350); }
async function sync(){
  if (!S || S.athlete) return;
  if (_syncing) { _again = true; return; }
  _syncing = true;
  try {
    lsSet('bg_ws', S.ws);
    if (S._meSig !== S.name + '|' + S.role) { await api('PATCH', '/me', {name:S.name, role:S.role}); S._meSig = S.name + '|' + S.role; }
    for (const c of COLS) {
      const cur = {}; S[c].forEach(o => cur[o.id] = o);
      for (const id in cur) {
        const s = JSON.stringify(cur[id]);
        if (synced[c][id] !== s) {
          try { await api('PUT', `/items/${c}/${id}`, cur[id]); synced[c][id] = s; }
          catch(e) {
            if (e.status === 402) { S[c] = S[c].filter(o => o.id !== id); toast(e.message + ' برای افزودن ورزشکار، اشتراک را ارتقا دهید.'); render(); }
            else throw e;
          }
        }
      }
      for (const id in synced[c]) if (!cur[id]) { await api('DELETE', `/items/${c}/${id}`); delete synced[c][id]; }
    }
  } catch(e) { console.warn(e); toast('ذخیره روی سرور انجام نشد: ' + e.message); }
  _syncing = false;
  if (_again) { _again = false; sync(); }
}

}

async function finishOnboard(){
  const role = ui.role || 'coach';
  const nm = ($('#obName').value || '').trim();
  const gym = $('#obGym') ? $('#obGym').value.trim() : nm;
  if (!nm) return toast('نام خود را وارد کنید');
  if (role === 'gym' && !gym) return toast('نام باشگاه را وارد کنید');
  $('#obBtn').disabled = true;
  try { applyBoot(await api('POST', '/onboard', {role, name: nm, wsName: gym})); view = 'dash'; stack = []; render(); }
  catch(e) { toast(e.message); $('#obBtn').disabled = false; }
}

function athleteList(compact){
  const all = inWs(S.athletes);
  const cnt = { all: all.length, active: all.filter(a=>a.status==='active').length, pending: all.filter(a=>a.status==='pending').length };
  const q = ui.athQ.trim();
  let list = all.filter(a => ui.athFilter==='all' || a.status===ui.athFilter);
  if (q) list = list.filter(a => (a.name+' '+(a.phone||'')+' '+(a.username||'')).includes(q));
  return `<div class="search">${I('search')}<input placeholder="جستجوی نام، یوزرنیم یا شماره تماس..." value="${esc(ui.athQ)}" oninput="ui.athQ=this.value;rerenderList()"></div>
  <div class="tabs">
    <button class="chip ${ui.athFilter==='all'?'on':''}" onclick="ui.athFilter='all';render()">همه (${faNum(cnt.all)})</button>
    <button class="chip ${ui.athFilter==='active'?'on':''}" onclick="ui.athFilter='active';render()">ورزشکاران فعال (${faNum(cnt.active)})</button>
    <button class="chip ${ui.athFilter==='pending'?'on':''}" onclick="ui.athFilter='pending';render()">در انتظار ورود (${faNum(cnt.pending)})</button>
  </div>
  <div id="athList">${athItems(list, all.length)}</div>`;
}
function athItems(list, total){
  if (!total) return emptyBox('list', 'هنوز ورزشکاری اضافه نشده است.', 'با دعوت از ورزشکاران، مدیریت برنامه‌ها و پیگیری پیشرفت آن‌ها را آغاز کنید.', 'دعوت ورزشکار جدید', "canAddAthlete()&&go('invite')");
  if (!list.length) return `<div class="card mut" style="text-align:center">نتیجه‌ای پیدا نشد.</div>`;
  return list.map(a => `<button class="item" onclick="go('athlete',{id:'${a.id}'})">${avatar(a.name, a.photo)}<div class="tx"><b>${esc(a.name)}</b><span>${a.status==='active'?'<span class="tag g">فعال</span>':'<span class="tag">در انتظار</span>'} ${esc(a.goal||'')}</span></div>${I('left')}</button>`).join('');
}
function rerenderList(){
  const all = inWs(S.athletes), q = ui.athQ.trim();
  let list = all.filter(a => ui.athFilter==='all' || a.status===ui.athFilter);
  if (q) list = list.filter(a => (a.name+' '+(a.phone||'')+' '+(a.username||'')).includes(q));
  $('#athList').innerHTML = athItems(list, all.length);
}

  if (ui.aPhoto !== undefined) { d.photo = ui.aPhoto; ui.aPhoto = undefined; }
  if (params.id) Object.assign(S.athletes.find(x=>x.id===params.id), d);
  else S.athletes.push({ id: uid(), ws: S.ws, created: Date.now(), ...d });
  save(); toast('ذخیره شد'); haptic('medium');
  if (params.id) back(); else { stack = [['athletes',{}]]; go('athlete', {id: S.athletes[S.athletes.length-1].id}, false); }
}

function delAthlete(id){ confirmBox('این ورزشکار حذف شود؟', () => {

function pickImage(maxSide, square, cb){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      let sw = img.width, sh = img.height, sx = 0, sy = 0;
      if (square) { const m = Math.min(sw, sh); sx = (sw - m)/2; sy = (sh - m)/2; sw = sh = m; }
      const k = Math.min(1, maxSide / Math.max(sw, sh));
      const c = document.createElement('canvas'); c.width = Math.round(sw*k); c.height = Math.round(sh*k);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => toast('این فایل تصویر قابل خواندن نیست.');
    img.src = url;
  };
  inp.click();
}

function aiFormValues(){
  const v = id => { const e = $('#'+id); return e ? e.value.trim() : ''; };
  return { sex:v('aiSex'), age:v('aiAge'), height:v('aiH'), weight:v('aiW'), goal:v('aiGoal'), level:v('aiLevel'), days:v('aiDays'), place:v('aiPlace'), minutes:v('aiMin'), kcal:v('aiKcal'), notes:v('aiNotes') };
}
function athletePre(a){ return a ? { height:a.h, weight:a.w, goal:GOALS.includes(a.goal)?a.goal:'', notes:a.note } : {}; }
function openAiSheet(kind){
  if (!CONFIG.ai) return toast('هوش مصنوعی هنوز روی سرور فعال نشده است.');
  const a = draft && draft.assigned && draft.assigned.length === 1 ? S.athletes.find(x => x.id === draft.assigned[0]) : null;
  const d = document.createElement('div'); d.className = 'sheet';
  d.innerHTML = `<div class="in"><h3>${I('stars')} ${kind==='diet'?'ساخت رژیم با هوش مصنوعی':'ساخت برنامه با هوش مصنوعی'}</h3>
    ${a ? `<p class="sm mut" style="margin-top:-6px">برای «${esc(a.name)}»</p>` : ''}${aiForm(kind, athletePre(a))}
    <div class="row"><button class="btn p" id="aiGo">${I('stars')} بساز</button><button class="btn o" id="aiNo">انصراف</button></div></div>`;
  d.onclick = e => { if (e.target === d) d.remove(); };
  d.querySelector('#aiNo').onclick = () => d.remove();
  d.querySelector('#aiGo').onclick = async () => {
    const vals = aiFormValues(); d.remove(); busy(true, 'هوش مصنوعی در حال طراحی است');
    try {
      const r = await api('POST', '/ai/' + (kind==='diet'?'diet':'program'), vals);
      const keep = { assigned: draft.assigned, _for: draft._for };
      draft = Object.assign(kind==='diet' ? r.diet : r.program, keep);
      if (kind !== 'diet' && !GOALS.includes(draft.goal)) draft.goal = vals.goal;
      if (kind === 'diet' && !GOALS.includes(draft.goal)) draft.goal = vals.goal;
      toast('آماده شد ✨ بررسی و ویرایش کنید، بعد ذخیره کنید.'); render();
    } catch(e) { toast(e.message); }
    busy(false);
  };
  document.body.appendChild(d);
}

/* آنالیز بدن با عکس — برای مربی (params.id = ورزشکار) و ورزشکار */
let analyzeState = {};
function vAnalyze(){
  const coachMode = !S.athlete;
  const a = coachMode ? S.athletes.find(x => x.id === params.id) : (ATH.length ? curA().athlete : null);
  const res = analyzeState.res;
  const head = pageHead('آنالیز بدن با هوش مصنوعی');
  if (res) return head + analysisView(res, a, coachMode) + `<button class="btn o w" style="margin-top:12px" onclick="analyzeState={};render()">${I('renew')} آنالیز جدید</button>`;
  return head + `<div class="card">
    <p class="sm" style="margin-top:0;line-height:2">یک عکس <b>تمام‌قد از روبه‌رو</b> با لباس ورزشی و نور خوب انتخاب کنید. هوش مصنوعی تیپ بدنی و نقاط قابل بهبود را ارزیابی می‌کند و برنامه‌ی تمرینی و رژیم پیشنهاد می‌دهد.</p>
    <button class="photo-pick" onclick="pickImage(1024,false,p=>{analyzeState.photo=p;render()})">${analyzeState.photo ? `<img src="${analyzeState.photo}">` : `${I('camera')}<span>انتخاب عکس</span>`}</button>
    ${aiForm('analyze', Object.assign(athletePre(a), analyzeState.pre || {}))}
    <button class="btn p w" onclick="runAnalyze()">${I('stars')} شروع آنالیز</button>
    <p class="sm mut" style="line-height:1.9;margin-bottom:0">🔒 عکس فقط برای آنالیز استفاده می‌شود و روی سرور ذخیره نمی‌شود. این ارزیابی پزشکی نیست.</p>
  </div>`;
}
async function runAnalyze(){
  if (!CONFIG.ai) return toast('هوش مصنوعی هنوز روی سرور فعال نشده است.');
  if (!analyzeState.photo) return toast('اول عکس را انتخاب کنید.');
  const vals = aiFormValues(); analyzeState.pre = vals;
  const body = Object.assign({photo: analyzeState.photo}, vals);
  if (S.athlete) body.athleteId = curA().athlete.id;
  busy(true, 'در حال آنالیز بدن');
  try { analyzeState.res = await api('POST', '/ai/analyze', body); analyzeState.photo = null; if (S.athlete && analyzeState.res.saved) { curA().analyses = (curA().analyses||[]).concat([Object.assign({t:Date.now()}, analyzeState.res)]); } render(); }
  catch(e) { toast(e.message); }
  busy(false);
}
function analysisView(r, a, coachMode){
  const an = r.analysis || {}, li = arr => (arr||[]).map(x => `<li>${esc(x)}</li>`).join('');
  const p = r.program || {}, d = r.diet || {};
  return `<div class="card">
    <div class="grid2" style="margin-top:0"><div class="kv"><span>تیپ بدنی</span><b>${esc(an.bodyType||'—')}</b></div><div class="kv"><span>تخمین چربی بدن</span><b>${esc(an.bodyFat||'—')}</b></div></div>
    <p style="line-height:2">${esc(an.summary||'')}</p>
    ${an.strengths && an.strengths.length ? `<b>${I('check')} نقاط قوت</b><ul class="notes">${li(an.strengths)}</ul>` : ''}
    ${an.focus && an.focus.length ? `<b style="display:block;margin-top:8px">${I('bolt')} تمرکز روی</b><ul class="notes">${li(an.focus)}</ul>` : ''}
    ${an.tips && an.tips.length ? `<b style="display:block;margin-top:8px">${I('info')} توصیه‌ها</b><ul class="notes">${li(an.tips)}</ul>` : ''}
  </div>
  <div class="sec"><h2>${I('cal')} برنامه پیشنهادی: ${esc(p.name||'')}</h2></div>
  <div class="card">${(p.days||[]).map(day => `<b style="display:block;margin:6px 0">${esc(day.title)}</b>${day.ex.map(e=>`<div style="display:flex;justify-content:space-between;padding:4px 0" class="sm"><span>${esc(e.n)}</span><span class="mut">${esc(e.s)} × ${esc(e.r)}</span></div>`).join('')}`).join('')}</div>
  <div class="sec"><h2>${I('apple')} رژیم پیشنهادی: ${esc(d.name||'')}${d.kcal?` <span class="pill">${faNum(d.kcal)} کالری</span>`:''}</h2></div>
  <div class="card">${(d.meals||[]).map(m => `<b style="display:block;margin:6px 0">🍽 ${esc(m.title)}</b><div class="sm" style="white-space:pre-line;line-height:1.9">${esc(m.items)}</div>`).join('')}</div>
  ${coachMode && a ? `<div class="row" style="margin-top:12px"><button class="btn p sm" onclick="saveAiResult('program')">${I('check')} ذخیره برنامه برای ${esc(a.name.split(' ')[0])}</button><button class="btn p sm" onclick="saveAiResult('diet')">${I('check')} ذخیره رژیم</button></div>` : ''}
  ${!coachMode ? `<div class="notice">✅ نتیجه برای مربی شما فرستاده شد تا برنامه‌تان را بر اساس آن تنظیم کند.</div>` : ''}`;
}
function saveAiResult(kind){
  const r = analyzeState.res, a = S.athletes.find(x => x.id === params.id);
  const src = kind === 'diet' ? r.diet : r.program;
  const item = Object.assign(JSON.parse(JSON.stringify(src)), { id: uid(), ws: S.ws, created: Date.now(), assigned: [a.id] });
  if (!GOALS.includes(item.goal)) item.goal = a.goal && GOALS.includes(a.goal) ? a.goal : GOALS[0];
  (kind === 'diet' ? S.diets : S.programs).push(item); save(); haptic('medium');
  toast(kind === 'diet' ? 'رژیم ذخیره و به ورزشکار اختصاص داده شد' : 'برنامه ذخیره و به ورزشکار اختصاص داده شد');
}
function analysesList(list, onclickFn){
  if (!list || !list.length) return '';
  return `<div class="sec"><h2>${I('stars')} آنالیزهای هوش مصنوعی</h2></div>` + list.slice().sort((x,y)=>y.t-x.t).map((r, i) =>
    `<button class="item" onclick="${onclickFn}(${i})"><div class="av">${I('stars')}</div><div class="tx"><b>${esc((r.analysis||{}).bodyType || 'آنالیز بدن')}</b><span>${dLong(r.t)} ${r.by==='athlete'?'— توسط ورزشکار':''}</span></div>${I('left')}</button>`).join('');
}
function openCoachAnalysis(i){ const a = S.athletes.find(x => x.id === params.id); const list = S.analyses.filter(r => r.a === a.id).sort((x,y)=>y.t-x.t); analyzeState = {res: list[i]}; go('analyze', {id: a.id}); }
function openAthAnalysis(i){ analyzeState = {res: (curA().analyses||[]).slice().sort((x,y)=>y.t-x.t)[i]}; go('aAnalyze'); }

/* دستیار گفتگو برای ورزشکار */
let chats = {};
function vAChat(){
  if (!ATH.length) return noCoach();
  const id = curA().athlete.id, msgs = chats[id] || [];
  return `${pageHeadless(I('stars') + ' دستیار هوشمند')}
  <div class="chat" id="chatBox">
    ${msgs.length ? '' : `<div class="card sm mut" style="line-height:2">سلام! هر سؤالی درباره‌ی اجرای حرکات، تغذیه، ریکاوری یا برنامه‌ات داری بپرس 💪<div class="acts" style="margin-top:8px">${['اسکوات رو چطور درست اجرا کنم؟','قبل از تمرین چی بخورم؟','بدن‌دردم زیاده، چیکار کنم؟'].map(q=>`<button class="chip" onclick="sendChat('${q}')">${q}</button>`).join('')}</div></div>`}
    ${msgs.map(m => `<div class="msg ${m.role}">${esc(m.content)}</div>`).join('')}
    ${ui.chatWait ? '<div class="msg assistant"><span class="dots">...</span></div>' : ''}
  </div>
  <div class="chatbar"><input id="chatIn" placeholder="سؤالت را بنویس..." onkeydown="if(event.key==='Enter')sendChat()"><button class="btn p" onclick="sendChat()">${I('left')}</button></div>`;
}
async function sendChat(text){
  if (!CONFIG.ai) return toast('هوش مصنوعی هنوز روی سرور فعال نشده است.');
  const inp = $('#chatIn'); text = (text || (inp && inp.value) || '').trim(); if (!text || ui.chatWait) return;
  const id = curA().athlete.id; chats[id] = (chats[id] || []).concat([{role:'user', content:text}]);
  ui.chatWait = true; render(); scrollChat();
  try { const r = await api('POST', '/ai/chat', {athleteId: id, messages: chats[id]}); chats[id].push({role:'assistant', content:r.reply}); }
  catch(e) { toast(e.message); chats[id].pop(); }
  ui.chatWait = false; render(); scrollChat();
}
function scrollChat(){ setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30); }
function changeMyPhoto(){
  ui.menu = false;
  pickImage(360, true, async p => { try { await api('POST', '/athlete/photo', {photo: p}); ATH.forEach(x => x.athlete.photo = p); toast('عکس پروفایل ذخیره شد'); render(); } catch(e) { toast(e.message); } });
}

/* ---------- render ---------- */
const VIEWS = { dash:vDash, athletes:vAthletes, invite:vInvite, athleteForm:vAthleteForm, athlete:vAthlete, assign:vAssign,
  programs:()=>listPage('programs'), programForm:vProgramForm, program:vProgram,
  diets:()=>listPage('diets'), dietForm:vDietForm, diet:vDiet, progress:vProgress,
  plans:vPlans, notifs:vNotifs, workspaces:vWorkspaces, settings:vSettings, analyze:vAnalyze };
function render(){
  const app = $('#app');
  if (!S) { app.innerHTML = auth.step === 'loading' ? `<div class="hdr"><div class="logo">${I('pulse')}</div></div><main><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>` : vLogin(); syncBack(); return; }
  if (S.athlete && S.role === 'athlete') { app.innerHTML = athHeader() + `<main>${(AVIEWS[view] || vAHome)()}</main>` + athNav(); syncBack(); return; }
  if (!S.role || S.athlete) { app.innerHTML = vOnboard(); syncBack(); return; }
  const body = (VIEWS[view] || vDash)();
  app.innerHTML = header() + `<main>${body}</main>` + nav();
  if (view==='plans' && params.hist) setTimeout(()=>{ const h=$('#hist'); h && h.scrollIntoView({behavior:'smooth'}); }, 50);
  syncBack();
}
function syncBack(){
  if (!tg || !tg.BackButton || !(tg.isVersionAtLeast && tg.isVersionAtLeast('6.1'))) return;
  if (stack.length && S && S.role) tg.BackButton.show(); else tg.BackButton.hide();
}

/* ---------- boot ---------- */
(async function boot(){
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    try { tg.setHeaderColor('#111214'); tg.setBackgroundColor('#EFF0F2'); try { tg.setBottomBarColor && tg.setBottomBarColor('#EFF0F2'); } catch(e){} } catch(e){}
    try { tg.BackButton.onClick(back); } catch(e){}
  }
  auth = {step:'loading'}; render();
  if (TOKEN) { try { applyBoot(await api('GET', '/bootstrap')); auth = {}; render(); return; } catch(e) { if (e.status !== 401) { auth = {step:'phone'}; render(); toast(e.message); return; } setToken(null); } }
  if (tg && tg.initData) { if (await tgLogin(true)) return; }
  auth = {step:'phone'}; render();
})();
</script>
</body>
</html>
