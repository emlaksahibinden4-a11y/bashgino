<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>باشگینو — سامانه مربیگری</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#A8121E; --red-d:#8C0E18; --red-l:#FDECEE; --red-t:#C81E2B;
  --bg:#F6F6F7; --card:#fff; --line:#ECECEE; --txt:#1B1B1F; --mut:#7A7A85;
  --yel:#FFFBEA; --yel-b:#F3DE9C; --yel-t:#B45309; --grn:#16A34A; --grn-l:#E9F8EF;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center}
.logo svg{width:22px;height:22px;stroke-width:2.2}
.ws{display:flex;align-items:center;gap:6px;background:#F3F3F5;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700}
.ws svg{width:16px;height:16px;color:var(--red)}
.ws .chev{color:var(--mut)}
.sp{flex:1}
.bell{position:relative;width:38px;height:38px;display:grid;place-items:center;color:#555}
.bell b{position:absolute;top:2px;right:4px;background:var(--red-t);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
.ava{width:36px;height:36px;border-radius:50%;background:var(--red-l);color:var(--red);display:grid;place-items:center;font-weight:800}

/* menu */
.menu{position:fixed;top:58px;left:12px;z-index:40;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.14);width:250px;padding:8px}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block}
.menu .who span{color:var(--mut);font-size:12px;direction:ltr;display:inline-block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;text-align:right}
.menu button:active{background:#F4F4F6}
.menu .out{color:var(--red-t)}
.scrim{position:fixed;inset:0;z-index:30}

/* layout */
main{padding:14px 14px calc(96px + var(--safe-b))}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:118px;margin:-14px -14px 10px;padding:16px 18px;overflow:hidden;background:linear-gradient(180deg,#fff,var(--bg))}
.hero h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px;z-index:1}
.hero h1 svg{color:var(--red);width:22px;height:22px}
.hero .art{position:absolute;left:0;top:0;height:100%;width:58%;opacity:.95}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;font-weight:700;padding:0 14px;white-space:nowrap}
.btn.p{background:var(--red);color:#fff}
.btn.p:active{background:var(--red-d)}
.btn.o{background:#fff;border:1.5px solid #DADADF}
.btn.ol{background:#fff;border:1.5px solid var(--red-t);color:var(--red-t)}
.btn.sm{height:38px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid #E0E0E4;background:#fff;font-size:13px;font-weight:600}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h2{font-size:16px;margin:0;display:flex;align-items:center;gap:6px}
.sec h2 svg{color:var(--red)}
.link{color:var(--red-t);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.link svg{width:14px;height:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mut{color:var(--mut)}
.sm{font-size:12px}

/* subscription card */
.sub{background:var(--yel);border:1px solid var(--yel-b)}
.sub .top{display:flex;gap:10px;align-items:center}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--yel-b);color:var(--yel-t)}
.ic svg{width:22px;height:22px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#fff;color:var(--yel-t)}
.tag.r{background:var(--red-l);color:var(--red-t)}
.tag.g{background:var(--grn-l);color:var(--grn)}
.cap{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-size:13px}
.bar{height:6px;border-radius:4px;background:#EFE6C4;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn);border-radius:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv{background:rgba(255,255,255,.65);border:1px solid #F0E3B5;border-radius:12px;padding:10px 12px}
.kv span{display:flex;align-items:center;gap:5px;color:#66666F;font-size:12px}
.kv span svg{width:14px;height:14px}
.kv b{display:block;margin-top:6px;font-size:15px}
.warn{display:flex;gap:6px;align-items:center;color:var(--yel-t);font-size:12px;margin:12px 0}
.warn svg{width:15px;height:15px}
.acts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.acts .chip{flex:none;padding:0 11px;font-size:12px}
.notice{background:var(--yel);border:1px solid var(--yel-b);color:var(--yel-t);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.9;margin-top:12px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat svg{color:var(--red);width:20px;height:20px}
.stat b{display:block;font-size:24px;margin:2px 0}
.stat span{font-size:12px;color:var(--mut)}
.range{font-size:12px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px;display:flex;align-items:center;gap:4px}
.range svg{width:13px;height:13px}

/* search + filters */
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;flex:1}
.search svg{color:var(--mut)}
.search input{border:0;outline:0;flex:1;background:none}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}

/* list items */
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:right}
.item .av{width:42px;height:42px;border-radius:12px;background:var(--red-l);color:var(--red);display:grid;place-items:center;font-weight:800;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12px;color:var(--mut)}
.item>svg{color:#B5B5BC}

/* empty */
.empty{text-align:center;padding:28px 16px}
.empty .ill{width:96px;height:96px;margin:0 auto 14px;border-radius:24px;background:var(--red-l);display:grid;place-items:center;color:var(--red);position:relative;transform:rotate(-4deg)}
.empty .ill svg{width:40px;height:40px}
.empty h3{margin:0 0 6px;font-size:16px}
.empty p{margin:0 0 16px;color:var(--mut);font-size:13px;line-height:1.9}
.empty .btn{display:inline-flex;min-width:180px}

/* skeleton */
.sk{height:72px;border-radius:14px;background:linear-gradient(90deg,#f0f0f2 25%,#f7f7f9 50%,#f0f0f2 75%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#6B6B75;padding:4px 0}
nav button i{width:40px;height:30px;border-radius:10px;display:grid;place-items:center}
nav button.on{color:var(--red-t);font-weight:700}
nav button.on i{background:var(--red-l)}
nav svg{width:21px;height:21px}

/* forms */
.f{margin-bottom:12px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid #DEDEE3;border-radius:12px;background:#fff;padding:12px;outline:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--red-t);box-shadow:0 0 0 3px var(--red-l)}
.f textarea{min-height:80px;resize:vertical}
.ltr{direction:ltr;text-align:right}
.ex{display:grid;grid-template-columns:2fr 1fr 1fr 28px;gap:6px;margin-bottom:6px}
.ex input{padding:10px 8px;border:1px solid #DEDEE3;border-radius:10px;width:100%;min-width:0}
.x{color:#B5B5BC;display:grid;place-items:center}
.day{border:1px dashed #DADADF;border-radius:14px;padding:12px;margin-bottom:10px;background:#FCFCFD}
.day h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.check input{width:18px;height:18px;accent-color:var(--red)}
.pagehead{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.pagehead h1{font-size:18px;margin:0}
.back{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.back svg{transform:scaleX(-1)}

/* plans */
.dur{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;margin:12px 0}
.dur button{flex:1;height:42px;border-radius:10px;font-weight:700;font-size:13px;position:relative;display:flex;align-items:center;justify-content:center;gap:4px}
.dur button.on{background:var(--red);color:#fff}
.dur em{position:absolute;top:-9px;right:6px;font-style:normal;font-size:10px;background:var(--red-t);color:#fff;border-radius:6px;padding:0 5px}
.plan{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;width:100%;text-align:right}
.plan.cur{border-color:#BFE5CC}
.plan .ic{border-color:var(--line);color:var(--red-t)}
.plan.cur .ic{background:var(--grn-l);color:var(--grn);border-color:#BFE5CC}
.plan .tx{flex:1;min-width:0}
.plan .tx b{font-size:15px}
.plan .tx p{margin:4px 0 0;font-size:12px;color:var(--mut)}
.plan .pr{text-align:left;border-right:1px solid var(--line);padding-right:10px}
.plan .pr b{color:var(--red-t);display:block;font-size:14px;white-space:nowrap}
.plan .pr span{font-size:11px;color:var(--mut)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;text-align:center;margin-top:12px}
.feat i{width:40px;height:40px;border-radius:12px;background:var(--red-l);color:var(--red);display:grid;place-items:center;margin:0 auto 6px}
.feat span{font-size:12px}
ul.notes{margin:8px 0 0;padding:0 18px;color:#55555E;font-size:13px;line-height:2}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px}
.ob .brand{text-align:center;margin-bottom:22px}
.ob .brand .logo{margin:0 auto 8px;width:56px;height:56px;border-radius:16px}
.ob .brand .logo svg{width:30px;height:30px}
.ob h1{font-size:20px;text-align:center;margin:0 0 6px}
.role{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;width:100%;text-align:right}
.role.on{border-color:var(--red-t);background:#FFF8F8}
.role .ic{background:var(--red-l);border:0;color:var(--red)}
.role b{display:block;font-size:15px}
.role span{font-size:12px;color:var(--mut);line-height:1.8}

/* sheet / toast */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet .in{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:86vh;overflow:auto;padding:18px 16px calc(18px + var(--safe-b))}
.sheet h3{margin:0 0 12px}
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:13px;max-width:90%;text-align:center}
.soon{text-align:center;padding:90px 20px;color:var(--mut);font-size:16px}
.soon svg{width:46px;height:46px;color:#D5D5DA;margin-bottom:10px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:#F1F1F3;color:#55555E;margin-left:4px}
</style>
</head>

  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',

function confirmBox(msg, cb){

function weekRange(){ // شنبه تا جمعه
  const n = new Date(); n.setHours(0,0,0,0);
  const back = (n.getDay() + 1) % 7; // Sat=0
  const s = new Date(n.getTime() - back*DAY); const e = new Date(s.getTime() + 7*DAY - 1);
  return [s.getTime(), e.getTime()];
}

/* ---------- storage: Telegram CloudStorage + localStorage ---------- */
const CS = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
const csGet = keys => new Promise((res, rej) => CS.getItems(keys, (e, v) => e ? rej(e) : res(v)));
const csSet = (k, v) => new Promise((res, rej) => CS.setItem(k, v, (e, ok) => e ? rej(e) : res(ok)));
const LKEY = 'bashgino_db_' + (tgUser ? tgUser.id : 'guest');
const Store = {
  async load(){
    if (CS) {
      try {
        const m = await csGet(['db_n']); const n = parseInt(m.db_n || '0');
        if (n > 0) {
          const keys = Array.from({length:n}, (_, i) => 'db_' + i);
          const parts = await csGet(keys);
          return JSON.parse(keys.map(k => parts[k] || '').join(''));
        }
      } catch(e) { console.warn('cloud load', e); }
    }
    try { return JSON.parse(localStorage.getItem(LKEY)); } catch(e) { return null; }
  },
  _t: null,
  save(){
    clearTimeout(this._t);
    this._t = setTimeout(async () => {
      const s = JSON.stringify(S);
      try { localStorage.setItem(LKEY, s); } catch(e) {}
      if (!CS) return;
      try {
        const chunks = s.match(/[\s\S]{1,3800}/g) || [''];
        for (let i = 0; i < chunks.length; i++) await csSet('db_' + i, chunks[i]);
        await csSet('db_n', String(chunks.length));
      } catch(e) { console.warn('cloud save', e); }
    }, 400);
  }
};

  return { p, used, max:p.users, left: Math.max(0, p.users-used), pct: Math.min(100, Math.round(used/p.users*100)), daysLeft, expired: now > p.end };
}

function logSession(id){ S.sessions.push({id:uid(), a:id, ws:S.ws, t:Date.now()}); save(); haptic('medium'); toast('تمرین امروز ثبت شد ✅'); render(); }
function delSession(id){ S.sessions = S.sessions.filter(s=>s.id!==id); save(); render(); }
function openChat(u){ const url='https://t.me/'+u; if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url,'_blank'); }
function delAthlete(id){ confirmBox('این ورزشکار حذف شود؟', () => {

  [...S.programs, ...S.diets].forEach(p => p.assigned = (p.assigned||[]).filter(x=>x!==id));

function openFilter(){
  const d = document.createElement('div'); d.className='sheet';
  d.innerHTML = `<div class="in"><h3>فیلتر برنامه‌ها</h3>${[['all','همه'],['assigned','تخصیص‌داده‌شده به ورزشکار'],['free','بدون ورزشکار']].map(([k,t])=>`<label class="check"><input type="radio" name="pf" ${ui.progFilter===k?'checked':''} value="${k}"><span>${t}</span></label>`).join('')}<button class="btn p w" style="margin-top:8px">اعمال</button></div>`;
  d.onclick = e => { if (e.target===d) d.remove(); };
  d.querySelector('.btn').onclick = () => { ui.progFilter = d.querySelector('input:checked').value; d.remove(); render(); };
  document.body.appendChild(d);
}

    <button class="link" style="margin-top:6px" onclick="draft.days[${i}].ex.push({n:'',s:'',r:''});render()">${I('plus')} افزودن حرکت</button></div>`).join('')}

function assignBlock(){
  const ath = inWs(S.athletes); if (!ath.length) return '';
  return `<div class="sec"><h2>${I('users')} تخصیص به ورزشکاران</h2></div>${ath.map(a=>`<label class="check"><input type="checkbox" ${(draft.assigned||[]).includes(a.id)?'checked':''} onchange="draft.assigned=draft.assigned.filter(x=>x!=='${a.id}');if(this.checked)draft.assigned.push('${a.id}')"><span>${esc(a.name)}</span></label>`).join('')}`;
}
function saveProgram(){
  const d = draft; if (!d.name.trim()) return toast('نام برنامه را وارد کنید');
  d.days.forEach(day => day.ex = day.ex.filter(e => e.n.trim())); delete d._for;
  if (params.id) Object.assign(S.programs.find(x=>x.id===params.id), d);
  else S.programs.push({ id: uid(), ws: S.ws, created: Date.now(), ...d });
  draft = null; save(); haptic('medium'); toast('برنامه ذخیره شد'); stack=[]; go('programs',{},false);
}

function delItem(kind, id){ confirmBox('حذف شود؟', ()=>{ S[kind]=S[kind].filter(x=>x.id!==id); save(); toast('حذف شد'); stack=[]; go(kind,{},false); }); }
function programText(kind, id){

  const t = programText(kind, id);

  if (!draft || draft._for !== ('d'+(params.id||''))) {
    const src = params.id ? S.diets.find(x=>x.id===params.id) : null;
    draft = src ? JSON.parse(JSON.stringify(src)) : { name:'', goal:GOALS[1], kcal:'', desc:'', meals:[{title:'صبحانه',items:''},{title:'ناهار',items:''},{title:'شام',items:''}], assigned:[] };
    draft._for = 'd'+(params.id||'');
  }
  const d = draft;
  return `${pageHead(params.id?'ویرایش برنامه تغذیه':'برنامه تغذیه جدید')}
  <div class="card">
    <div class="f"><label>نام برنامه *</label><input value="${esc(d.name)}" oninput="draft.name=this.value" placeholder="مثلاً رژیم کات ۲۰۰۰ کالری"></div>
    <div class="row">
      <div class="f"><label>هدف</label><select onchange="draft.goal=this.value">${GOALS.map(g=>`<option ${d.goal===g?'selected':''}>${g}</option>`).join('')}</select></div>
      <div class="f"><label>کالری روزانه</label><input inputmode="numeric" value="${esc(d.kcal)}" oninput="draft.kcal=this.value" placeholder="۲۰۰۰"></div>
    </div>
    <div class="f"><label>توضیحات</label><textarea oninput="draft.desc=this.value">${esc(d.desc)}</textarea></div>
  </div>
  <div class="sec"><h2>${I('apple')} وعده‌ها</h2></div>
  ${d.meals.map((m,i)=>`<div class="day"><h4><input value="${esc(m.title)}" oninput="draft.meals[${i}].title=this.value" style="border:0;background:none;font-weight:700;font-size:14px;outline:0;flex:1"><button class="x" onclick="draft.meals.splice(${i},1);render()">${I('trash')}</button></h4>
    <div class="f" style="margin:0"><textarea oninput="draft.meals[${i}].items=this.value" placeholder="هر قلم در یک خط، مثلاً:\n۲ عدد تخم‌مرغ\n۱ کف دست نان سبوس‌دار">${esc(m.items)}</textarea></div></div>`).join('')}
  <button class="btn o w" onclick="draft.meals.push({title:'میان‌وعده',items:''});render()">${I('plus')} افزودن وعده</button>
  ${assignBlock()}
  <button class="btn p w" style="margin-top:14px" onclick="saveDiet()">${I('check')} ذخیره برنامه</button>`;
}
function saveDiet(){
  const d = draft; if (!d.name.trim()) return toast('نام برنامه را وارد کنید');
  d.meals = d.meals.filter(m => m.title.trim() || m.items.trim()); delete d._for;
  if (params.id) Object.assign(S.diets.find(x=>x.id===params.id), d);
  else S.diets.push({ id: uid(), ws: S.ws, created: Date.now(), ...d });
  draft = null; save(); haptic('medium'); toast('برنامه ذخیره شد'); stack=[]; go('diets',{},false);
}
function vDiet(){
  const p = S.diets.find(x=>x.id===params.id); if (!p) { back(); return ''; }
  const names = (p.assigned||[]).map(id => (S.athletes.find(a=>a.id===id)||{}).name).filter(Boolean);
  return `${pageHead(esc(p.name))}
  <div class="card"><span class="pill">${esc(p.goal)}</span>${p.kcal?`<span class="pill">${faNum(p.kcal)} کالری</span>`:''}${p.desc?`<p style="line-height:1.9;margin:10px 0 0">${esc(p.desc)}</p>`:''}</div>
  ${(p.meals||[]).map(m=>`<div class="sec"><h2>${I('apple')} ${esc(m.title)}</h2></div><div class="card" style="white-space:pre-line;line-height:2">${esc(m.items)||'<span class="mut sm">—</span>'}</div>`).join('')}
  <div class="sec"><h2>${I('users')} ورزشکاران</h2></div><div class="card">${names.length?names.map(esc).join('، '):'<span class="mut sm">به کسی تخصیص داده نشده</span>'}</div>
  <div class="row" style="margin-top:14px">
    <button class="btn p sm" onclick="shareProgram('diets','${p.id}')">${I('share')} ارسال متن برنامه</button>
    <button class="btn o sm" onclick="draft=null;go('dietForm',{id:'${p.id}'})">${I('edit')} ویرایش</button>
    <button class="btn o sm" style="color:var(--red-t);flex:.6" onclick="delItem('diets','${p.id}')">${I('trash')}</button>
  </div>`;
}

function vProgress(){ return `<div class="soon">${I('camera')}<div>به‌زودی</div><p class="sm" style="line-height:2">ثبت عکس، وزن و اندازه‌های بدن ورزشکاران و مقایسه پیشرفت آن‌ها در این بخش اضافه می‌شود.</p></div>`; }

/* plans */
function priceFor(p, dur){ const tot = p.monthly * dur.m * (100 - dur.off) / 100; return Math.round(tot/1000)*1000; }
function vPlans(){
  const dur = CONFIG.durations.find(d => d.m===ui.dur) || CONFIG.durations[0];
  const maxOff = Math.max(...CONFIG.durations.map(d=>d.off));
  const cur = S.plan.id;
  return `${pageHead('پلن و اشتراک')}
  <div class="card" style="border:0;background:none;padding:0 2px">
    <span class="sm" style="color:var(--red-t);font-weight:700">${I('crown')} پلن‌های اشتراکی</span>
    <h2 style="margin:6px 0">پلن ${S.role==='gym'?'باشگاه':'فضای کاری'}</h2>
    <p class="mut sm" style="line-height:1.9;margin:0">پلن مناسب با تعداد کاربران تیم خود را انتخاب کنید و به‌صورت ماهانه از تمام امکانات ${CONFIG.appName} استفاده کنید.</p>
  </div>
  <div class="notice" style="background:#EEF4FF;border-color:#C9DAFF;color:#2952A3">با ارتقای پلن، ظرفیت جدید بلافاصله پس از پرداخت فعال می‌شود.</div>
  <div style="margin-top:12px">${subCard()}</div>
  ${!CONFIG.paymentsEnabled ? `<div class="notice">پرداخت آنلاین هنوز فعال نشده است. پلن‌ها را می‌بینید، اما خرید و تمدید تا اتصال درگاه پرداخت غیرفعال است.</div>` : ''}
  <div class="dur">${CONFIG.durations.map(d=>`<button class="${d.m===ui.dur?'on':''}" onclick="ui.dur=${d.m};render()">${d.off===maxOff&&d.off?`<em>${faNum(d.off)}٪ تخفیف</em>`:''}${I('cal')} ${faNum(d.m)} ماهه</button>`).join('')}</div>
  <div class="plan ${cur==='trial'?'cur':''}"><div class="ic">${I('stars')}</div><div class="tx"><b>تا ${faNum(CONFIG.trialUsers)} کاربر</b> ${cur==='trial'?'<span class="tag r">فعال</span>':''}<p>دوره آزمایشی؛ ${faNum(CONFIG.trialDays)} روز دسترسی کامل.</p></div><div class="pr"><b style="color:var(--grn)">رایگان</b><span>به مدت ${faNum(CONFIG.trialDays)} روز</span></div></div>
  ${CONFIG.plans.map(p=>`<button class="plan ${cur===p.id?'cur':''}" onclick="buyPlan('${p.id}')"><div class="ic">${I(p.icon)}</div><div class="tx"><b>تا ${faNum(p.users)} کاربر</b> ${cur===p.id?'<span class="tag g">فعال</span>':(!CONFIG.paymentsEnabled?'<span class="tag r">به‌زودی</span>':'')}<p>${p.desc}</p></div><div class="pr"><b>${fa(priceFor(p,dur))} تومان</b><span>برای ${faNum(dur.m)} ماه</span></div></button>`).join('')}
  <div class="plan"><div class="ic">${I('build')}</div><div class="tx"><b>پلن اختصاصی</b><p>به تعداد کاربر بیشتر یا امکانات سفارشی نیاز دارید؟</p></div></div>
  <button class="btn ol w" onclick="support()">${I('headset')} تماس با ما</button>
  <p class="sm mut" style="text-align:center">بیشترین تخفیف دوره‌های بلندمدت ${faNum(maxOff)}٪ است.</p>
  <div class="card"><b style="display:block;text-align:center">تمام پلن‌ها شامل امکانات اصلی ${CONFIG.appName} هستند</b>
    <div class="feat">${[['userplus','مدیریت ورزشکاران'],['apple','برنامه‌های تغذیه'],['dumb','طراحی برنامه تمرینی'],['shield','امکانات و پشتیبانی'],['chart','گزارش و پیشرفت'],['book','کتابخانه حرکات']].map(([i,t])=>`<div><i>${I(i)}</i><span>${t}</span></div>`).join('')}</div></div>
  <div class="card" style="margin-top:10px;background:#FAFAFB"><b style="display:flex;gap:6px;align-items:center">${I('info')} نکات مهم اشتراک</b>
    <ul class="notes"><li>اشتراک‌ها به‌صورت ماهانه محاسبه و تمدید می‌شوند.</li><li>امکان ارتقای پلن در هر زمان وجود دارد.</li><li>دوره آزمایشی ${faNum(CONFIG.trialDays)} روزه فقط یک‌بار برای هر حساب فعال می‌شود.</li><li>پس از پایان اشتراک، خرید جدید باید انجام شود تا همان لحظه فعال شود.</li></ul></div>
  <div class="sec" id="hist"><h2>${I('receipt')} تاریخچه پرداخت‌ها</h2></div>
  <div class="card mut sm" style="text-align:center;background:#FAFAFB">${S.payments.length ? '' : 'هنوز پرداختی برای این فضا ثبت نشده است.'}</div>
  <div style="display:flex;justify-content:center;gap:18px;margin-top:14px" class="sm">
    <button class="link" onclick="go('settings')">${I('gear')} پلن در تنظیمات</button><button class="link" onclick="stack=[];go('dash',{},false)">بازگشت به داشبورد</button></div>`;
}
function buyPlan(id){
  if (!CONFIG.paymentsEnabled) return toast('پرداخت آنلاین هنوز فعال نشده است. برای خرید با پشتیبانی تماس بگیرید.');
  // اینجا را به درگاه پرداخت یا Telegram Stars وصل کنید
}

/* misc pages */
function vNotifs(){
  S.notifs.forEach(n => n.read = true); save();
  return `${pageHead('اعلان‌ها')}${S.notifs.length ? S.notifs.slice().reverse().map(n=>`<div class="item"><div class="av">${I('bell')}</div><div class="tx"><b style="white-space:normal;font-weight:500;line-height:1.8">${esc(n.text)}</b><span>${dLong(n.t)}</span></div></div>`).join('') : '<div class="card mut">اعلانی ندارید.</div>'}`;
}
function vWorkspaces(){
  return `${pageHead('مدیریت فضاها')}
  <p class="mut sm" style="margin-top:0;line-height:1.9">${S.role==='gym'?'برای هر شعبه یا سالن یک فضای جداگانه بسازید.':'می‌توانید برای هر باشگاهی که در آن کار می‌کنید یک فضای جدا داشته باشید.'}</p>
  ${S.workspaces.map(w=>`<button class="item" onclick="S.ws='${w.id}';save();stack=[];go('dash',{},false)"><div class="av">${I(w.type==='gym'?'build':'person')}</div><div class="tx"><b>${esc(w.name)}</b><span>${faNum(S.athletes.filter(a=>a.ws===w.id).length)} ورزشکار</span></div>${w.id===S.ws?'<span class="tag g">فعال</span>':I('left')}</button>`).join('')}
  <div class="row" style="margin-top:6px"><input id="wsName" placeholder="نام فضای جدید" style="border:1px solid #DEDEE3;border-radius:12px;padding:12px;flex:2"><button class="btn p" onclick="addWs()">${I('plus')} افزودن</button></div>
  ${S.role==='gym' ? `<div class="sec"><h2>${I('users')} مربیان این باشگاه</h2></div>
    ${inWs(S.coaches).map(c=>`<div class="item"><div class="av">${esc(c.name[0])}</div><div class="tx"><b>${esc(c.name)}</b><span class="ltr">${esc(c.phone||'')}</span></div><button class="x" onclick="S.coaches=S.coaches.filter(x=>x.id!=='${c.id}');save();render()">${I('trash')}</button></div>`).join('') || '<div class="card mut sm">هنوز مربی‌ای اضافه نشده.</div>'}
    <div class="row" style="margin-top:8px"><input id="cName" placeholder="نام مربی" style="border:1px solid #DEDEE3;border-radius:12px;padding:12px;flex:1.4"><input id="cPhone" placeholder="موبایل" class="ltr" style="border:1px solid #DEDEE3;border-radius:12px;padding:12px;flex:1"><button class="btn p" style="flex:.5" onclick="addCoach()">${I('plus')}</button></div>` : ''}`;
}
function addWs(){ const n = $('#wsName').value.trim(); if (!n) return; const w={id:uid(),name:n,type:S.role}; S.workspaces.push(w); save(); toast('فضا ساخته شد'); render(); }
function addCoach(){ const n=$('#cName').value.trim(); if(!n) return toast('نام مربی را وارد کنید'); S.coaches.push({id:uid(),ws:S.ws,name:n,phone:$('#cPhone').value.trim()}); save(); render(); }
function vSettings(){
  return `${pageHead('حساب کاربری و تنظیمات')}
  <div class="card">
    <div class="f"><label>نام نمایشی</label><input id="sName" value="${esc(S.name)}"></div>
    <div class="f"><label>نوع حساب</label><select id="sRole"><option value="coach" ${S.role==='coach'?'selected':''}>مربی شخصی</option><option value="gym" ${S.role==='gym'?'selected':''}>باشگاه</option></select></div>
    <div class="f"><label>نام فضای فعلی</label><input id="sWs" value="${esc(curWs().name)}"></div>
    <button class="btn p w" onclick="saveSettings()">${I('check')} ذخیره</button>
  </div>
  <div class="card" style="margin-top:10px">
    <div class="sm mut" style="line-height:2">اطلاعات شما ${CS?'در فضای ابری تلگرامِ حساب خودتان ذخیره می‌شود و روی همه دستگاه‌ها در دسترس است.':'روی همین دستگاه ذخیره می‌شود.'}</div>
    <div class="row" style="margin-top:10px"><button class="btn o sm" onclick="exportData()">خروجی گرفتن از اطلاعات</button><button class="btn o sm" style="color:var(--red-t)" onclick="resetAll()">${I('trash')} پاک کردن همه</button></div>
  </div>`;
}
function saveSettings(){ S.name=$('#sName').value.trim()||S.name; S.role=$('#sRole').value; curWs().name=$('#sWs').value.trim()||curWs().name; save(); toast('ذخیره شد'); back(); }
function exportData(){ copyText(JSON.stringify(S)); }
function resetAll(){ confirmBox('همه اطلاعات پاک شود؟ این کار قابل بازگشت نیست.', ()=>{ const t=S.trialStart, p=S.plan; S=freshState(); S.trialStart=t; S.plan=p; save(); stack=[]; view='dash'; render(); }); }
function support(){ ui.menu=false; const url='https://t.me/'+CONFIG.supportUsername; if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url,'_blank'); }
function exitApp(){ if (tg) tg.close(); else toast('خروج'); }

/* ---------- render ---------- */
const VIEWS = { dash:vDash, athletes:vAthletes, invite:vInvite, athleteForm:vAthleteForm, athlete:vAthlete, assign:vAssign,
  programs:()=>listPage('programs'), programForm:vProgramForm, program:vProgram,
  diets:()=>listPage('diets'), dietForm:vDietForm, diet:vDiet, progress:vProgress,
  plans:vPlans, notifs:vNotifs, workspaces:vWorkspaces, settings:vSettings };
function render(){
  const app = $('#app');
  if (!S) { app.innerHTML = `<div class="hdr"><div class="logo">${I('pulse')}</div></div><main><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>`; return; }
  if (!S.role) { app.innerHTML = vOnboard(); syncBack(); return; }
  const body = (VIEWS[view] || vDash)();
  app.innerHTML = header() + `<main>${body}</main>` + nav();
  if (view==='plans' && params.hist) setTimeout(()=>{ const h=$('#hist'); h && h.scrollIntoView({behavior:'smooth'}); }, 50);
  syncBack();
}
function syncBack(){
  if (!tg || !tg.BackButton || !(tg.isVersionAtLeast && tg.isVersionAtLeast('6.1'))) return;
  if (stack.length && S && S.role) tg.BackButton.show(); else tg.BackButton.hide();
}

/* ---------- boot ---------- */
(async function boot(){
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    try { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#F6F6F7'); } catch(e){}
    try { tg.BackButton.onClick(back); } catch(e){}
  }
  render();
  const data = await Store.load();
  S = data && data.v ? Object.assign(freshState(), data) : freshState();
  if (!data) save();
  render();
})();
</script>
</body>
</html>
